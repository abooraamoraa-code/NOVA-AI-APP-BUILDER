<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول - NOVA AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(108, 99, 255, 0.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(37, 214, 149, 0.10),
          transparent 30%
        ),
        #070b16;

      color: #ffffff;

      font-family:
        Arial,
        Tahoma,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .logo {
      width: 58px;
      height: 58px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #8b7cff
        );

      font-size: 24px;
      font-weight: 900;

      box-shadow:
        0 15px 40px
        rgba(108, 99, 255, 0.25);
    }

    .title {
      text-align: center;
      margin-bottom: 28px;
    }

    .title h1 {
      font-size: 28px;
      margin-bottom: 9px;
    }

    .title p {
      color: #9aa6c1;
      font-size: 14px;
    }

    .box {
      border: 1px solid #25304a;

      background:
        rgba(13, 19, 36, 0.94);

      border-radius: 22px;

      padding: 28px;

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.30);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      color: #dfe5f7;

      font-size: 13px;
    }

    .field input {
      width: 100%;

      border: 1px solid #293552;

      outline: none;

      background: #080d1b;

      color: white;

      border-radius: 12px;

      padding: 14px;

      transition: 0.2s;
    }

    .field input:focus {
      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108, 99, 255, 0.10);
    }

    .btn {
      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #8b7cff
        );

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .btn:hover {
      transform:
        translateY(-1px);
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.7;
    }

    .message.error {
      display: block;

      background:
        rgba(255, 93, 115, 0.10);

      border:
        1px solid
        rgba(255, 93, 115, 0.25);

      color: #ff9aaa;
    }

    .message.success {
      display: block;

      background:
        rgba(37, 214, 149, 0.10);

      border:
        1px solid
        rgba(37, 214, 149, 0.25);

      color: #72e7ba;
    }

    .links {
      margin-top: 20px;

      text-align: center;

      color: #9aa6c1;

      font-size: 13px;
    }

    .links a {
      color: #8b7cff;

      text-decoration: none;

      cursor: pointer;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;

      margin-top: 18px;

      text-align: center;

      color: #69758f;

      font-size: 12px;

      text-decoration: none;
    }

  </style>

</head>

<body>

  <main class="container">

    <div class="logo">
      N
    </div>

    <div class="title">

      <h1>
        مرحبًا بك في NOVA AI
      </h1>

      <p>
        سجل الدخول إلى منصة بناء التطبيقات
      </p>

    </div>

    <section class="box">

      <form id="loginForm">

        <div class="field">

          <label for="email">
            البريد الإلكتروني
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >

        </div>

        <div class="field">

          <label for="password">
            كلمة المرور
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="أدخل كلمة المرور"
            required
          >

        </div>

        <button
          class="btn"
          id="loginButton"
          type="submit"
        >
          تسجيل الدخول
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

      <div class="links">

        ليس لديك حساب؟

        <a href="signup.html">
          إنشاء حساب
        </a>

      </div>

      <a
        class="back"
        href="index.html"
      >
        ← العودة إلى الصفحة الرئيسية
      </a>

    </section>

  </main>

  <script>

    const form =
      document.getElementById(
        "loginForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "password"
            )
            .value;

        message.className =
          "message";

        message.textContent =
          "";

        button.disabled =
          true;

        button.textContent =
          "جاري تسجيل الدخول...";

        try {

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    email,
                    password
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "فشل تسجيل الدخول"
            );
          }

          if (
            data.session &&
            data.session.access_token
          ) {

            localStorage.setItem(
              "nova_access_token",
              data.session.access_token
            );

            localStorage.setItem(
              "nova_refresh_token",
              data.session.refresh_token ||
              ""
            );

          }

          message.className =
            "message success";

          message.textContent =
            "تم تسجيل الدخول بنجاح. جاري الانتقال...";

          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            700
          );

        } catch (error) {

          message.className =
            "message error";

          message.textContent =
            error.message ||
            "حدث خطأ أثناء تسجيل الدخول";

        } finally {

          button.disabled =
            false;

          button.textContent =
            "تسجيل الدخول";

        }

      }
    );

  </script>

</body>

</html>
